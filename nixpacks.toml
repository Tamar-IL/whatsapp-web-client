# Railway build configuration via Nixpacks.
# Installs ffmpeg (required for voice message conversion) alongside Node.

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg-full"]

[phases.install]
# --include=dev forces devDependencies (tsc, vite, prisma) to install even when
# NODE_ENV=production is present in the build environment. Without this the build
# step fails with "tsc: not found".
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npm --workspace apps/backend run prisma:generate",
  "npm --workspace apps/backend run build",
  "npm --workspace apps/frontend run build"
]

[start]
cmd = "npm --workspace apps/backend run start:prod"

# Runtime envs that Nixpacks should preserve from Railway service config.
[variables]
NODE_ENV = "production"
